<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indovina la lingua</title>
  <style>
    /* Reset e configurazione base ad alto contrasto, senza dipendenze esterne */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Arial', 'Helvetica Neue', Helvetica, sans-serif;
      text-align: left;
    }

    body {
      background-color: #F8FAFC;
      color: #0F172A;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      line-height: 1.4;
    }

    /* Contenitore principale responsive adatto a LIM, tablet e telefono */
    .app-container {
      width: 100%;
      max-width: 820px;
      background-color: #FFFFFF;
      border: 4px solid #0F172A;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 0 #0F172A;
    }

    /* Intestazione */
    .header {
      border-bottom: 3px solid #E2E8F0;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }

    .title {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      color: #0F172A;
      margin-bottom: 8px;
    }

    .progress-text {
      font-size: clamp(1.2rem, 3vw, 1.5rem);
      font-weight: 700;
      color: #334155;
    }

    /* Box di avviso per file MP3 mancante o errori di riproduzione */
    .error-banner {
      display: none;
      background-color: #FEF2F2;
      border: 4px solid #B91C1C;
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 24px;
      color: #7F1D1D;
    }

    .error-banner.visible {
      display: block;
    }

    .error-title {
      font-size: clamp(1.25rem, 3vw, 1.6rem);
      font-weight: 800;
      margin-bottom: 6px;
    }

    .error-detail {
      font-size: clamp(1.1rem, 2.5vw, 1.4rem);
      font-weight: 600;
    }

    /* Messaggio di stato / guida per il bambino */
    .instruction-box {
      font-size: clamp(1.3rem, 3.2vw, 1.75rem);
      font-weight: 700;
      color: #0F172A;
      margin-bottom: 20px;
    }

    /* Stile comune per tutti i pulsanti grandi (altezza minima 80px) */
    .big-button {
      width: 100%;
      min-height: 88px;
      padding: 16px 24px;
      border: 4px solid #0F172A;
      border-radius: 18px;
      font-size: clamp(1.5rem, 4vw, 2.1rem);
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 18px;
      transition: transform 0.1s ease, background-color 0.15s ease;
      box-shadow: 0 6px 0 #0F172A;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .big-button:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0F172A;
    }

    .big-button:focus-visible {
      outline: 4px solid #2563EB;
      outline-offset: 4px;
    }

    /* Pulsante Ascolta */
    .listen-btn {
      background-color: #FDE047;
      color: #0F172A;
      margin-bottom: 28px;
    }

    .listen-btn:hover {
      background-color: #FACC15;
    }

    .listen-btn.playing {
      background-color: #FEF08A;
    }

    /* Icona altoparlante SVG dentro il pulsante Ascolta */
    .speaker-icon {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }

    /* Contenitore delle 3 carte */
    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-bottom: 28px;
    }

    /* Singola carta con bandiera e parola */
    .language-card {
      width: 100%;
      min-height: 96px;
      padding: 16px 22px;
      background-color: #FFFFFF;
      color: #0F172A;
      border: 4px solid #0F172A;
      border-radius: 18px;
      font-size: clamp(1.6rem, 4.2vw, 2.2rem);
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 22px;
      box-shadow: 0 6px 0 #0F172A;
      transition: background-color 0.15s ease, transform 0.1s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .language-card:hover:not(:disabled) {
      background-color: #EFF6FF;
    }

    .language-card:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0F172A;
    }

    .language-card:disabled {
      cursor: default;
    }

    /* Contenitore bandiera SVG */
    .flag-wrapper {
      width: 84px;
      height: 56px;
      border: 3px solid #0F172A;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      background-color: #FFFFFF;
      display: flex;
    }

    .flag-wrapper svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Stato risposta giusta */
    .language-card.correct {
      background-color: #22C55E;
      color: #052E16;
      border-color: #052E16;
      box-shadow: 0 6px 0 #052E16;
    }

    /* Stato risposta sbagliata con tremolio */
    .language-card.wrong {
      background-color: #FECACA;
      border-color: #B91C1C;
      animation: cardShake 0.45s ease-in-out;
    }

    @keyframes cardShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-12px); }
      40% { transform: translateX(12px); }
      60% { transform: translateX(-9px); }
      80% { transform: translateX(9px); }
    }

    /* Pulsante Avanti */
    .next-btn {
      display: none;
      background-color: #38BDF8;
      color: #0F172A;
    }

    .next-btn.visible {
      display: flex;
    }

    .next-btn:hover {
      background-color: #0EA5E9;
    }

    /* Schermata finale */
    .end-screen {
      display: none;
      padding: 16px 0;
    }

    .end-screen.visible {
      display: block;
    }

    .game-screen.hidden {
      display: none;
    }

    .bravi-title {
      font-size: clamp(3rem, 8vw, 4.5rem);
      font-weight: 900;
      color: #15803D;
      margin-bottom: 16px;
    }

    .bravi-subtitle {
      font-size: clamp(1.4rem, 3.5vw, 1.9rem);
      font-weight: 700;
      color: #0F172A;
      margin-bottom: 32px;
    }

    .restart-btn {
      background-color: #4ADE80;
      color: #052E16;
    }

    .restart-btn:hover {
      background-color: #22C55E;
    }

    /* Adattamento per schermi molto piccoli (telefoni stretti) */
    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .app-container {
        padding: 16px;
        border-width: 3px;
      }

      .flag-wrapper {
        width: 68px;
        height: 46px;
      }

      .language-card {
        padding: 14px 16px;
        gap: 16px;
      }
    }
  </style>
</head>
<body>

  <main class="app-container" aria-live="polite">
    <!-- Intestazione fissa -->
    <header class="header">
      <h1 class="title">Indovina la lingua</h1>
      <p id="progress-label" class="progress-text">Domanda 1 di 4</p>
    </header>

    <!-- Avviso errore file MP3 mancante -->
    <section id="error-banner" class="error-banner" role="alert">
      <p class="error-title">Attenzione: file audio non trovato</p>
      <p id="error-message" class="error-detail">Impossibile aprire il file.</p>
    </section>

    <!-- Schermata di gioco -->
    <section id="game-screen" class="game-screen">
      <p id="instruction-text" class="instruction-box">Premi «Ascolta» e poi tocca la bandiera giusta.</p>

      <!-- Grande pulsante Ascolta -->
      <button type="button" id="listen-button" class="big-button listen-btn">
        <svg class="speaker-icon" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="#0F172A"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
        <span id="listen-label">Ascolta</span>
      </button>

      <!-- Contenitore delle 3 carte -->
      <div id="cards-container" class="cards-list"></div>

      <!-- Pulsante Avanti (appare dopo la risposta giusta) -->
      <button type="button" id="next-button" class="big-button next-btn">
        <span>Avanti &rarr;</span>
      </button>
    </section>

    <!-- Schermata finale -->
    <section id="end-screen" class="end-screen">
      <h2 class="bravi-title">Bravi!</h2>
      <p class="bravi-subtitle">Avete indovinato tutte le lingue.</p>
      <button type="button" id="restart-button" class="big-button restart-btn">
        <span>Ricomincia</span>
      </button>
    </section>
  </main>

  <script>
    (function () {
      'use strict';

      /**
       * Elenco completo delle lingue e dei rispettivi file MP3 nella stessa cartella.
       * Le bandiere sono disegnate in SVG puro per garantire la massima nitidezza
       * su LIM, tablet e smartphone senza dipendere dai font di sistema o da internet.
       */
      const LINGUE = [
        {
          id: 'italiano',
          nome: 'Italiano',
          file: 'italiano1.mp3',
          bandieraSvg: `
            <svg viewBox="0 0 3 2" preserveAspectRatio="none" aria-hidden="true">
              <rect width="1" height="2" x="0" fill="#009246"></rect>
              <rect width="1" height="2" x="1" fill="#FFFFFF"></rect>
              <rect width="1" height="2" x="2" fill="#CE2B37"></rect>
            </svg>
          `
        },
        {
          id: 'inglese',
          nome: 'Inglese',
          file: 'inglese1.mp3',
          bandieraSvg: `
            <svg viewBox="0 0 5 3" preserveAspectRatio="none" aria-hidden="true">
              <rect width="5" height="3" fill="#FFFFFF"></rect>
              <rect x="2.1" y="0" width="0.8" height="3" fill="#CE1124"></rect>
              <rect x="0" y="1.1" width="5" height="0.8" fill="#CE1124"></rect>
            </svg>
          `
        },
        {
          id: 'spagnolo',
          nome: 'Spagnolo',
          file: 'spagnolo1.mp3',
          bandieraSvg: `
            <svg viewBox="0 0 3 2" preserveAspectRatio="none" aria-hidden="true">
              <rect width="3" height="2" fill="#AA151B"></rect>
              <rect width="3" height="1" y="0.5" fill="#F1BF00"></rect>
            </svg>
          `
        },
        {
          id: 'tedesco',
          nome: 'Tedesco',
          file: 'tedesco1.mp3',
          bandieraSvg: `
            <svg viewBox="0 0 5 3" preserveAspectRatio="none" aria-hidden="true">
              <rect width="5" height="1" y="0" fill="#000000"></rect>
              <rect width="5" height="1" y="1" fill="#DD0000"></rect>
              <rect width="5" height="1" y="2" fill="#FFCE00"></rect>
            </svg>
          `
        }
      ];

      // Riferimenti agli elementi DOM
      const progressLabel = document.getElementById('progress-label');
      const errorBanner = document.getElementById('error-banner');
      const errorMessage = document.getElementById('error-message');
      const gameScreen = document.getElementById('game-screen');
      const endScreen = document.getElementById('end-screen');
      const instructionText = document.getElementById('instruction-text');
      const listenButton = document.getElementById('listen-button');
      const listenLabel = document.getElementById('listen-label');
      const cardsContainer = document.getElementById('cards-container');
      const nextButton = document.getElementById('next-button');
      const restartButton = document.getElementById('restart-button');

      // Stato interno della partita (solo in memoria, nessun dato salvato)
      let ordineDomande = [];
      let indiceCorrente = 0;
      let roundRisolto = false;
      let audioPlayer = new Audio();
      let audioContext = null;

      /**
       * Mescola un array usando l'algoritmo Fisher-Yates.
       */
      function mescolaArray(lista) {
        const copia = lista.slice();
        for (let i = copia.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const temp = copia[i];
          copia[i] = copia[j];
          copia[j] = temp;
        }
        return copia;
      }

      /**
       * Suona due note brevi di festa tramite Web Audio API (senza file esterni).
       */
      function suonaNoteFesta() {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;

          if (!audioContext) {
            audioContext = new AudioCtx();
          }

          if (audioContext.state === 'suspended') {
            audioContext.resume();
          }

          const adesso = audioContext.currentTime;

          // Prima nota: Do5 (523.25 Hz)
          riproduciNota(523.25, adesso, 0.14);
          // Seconda nota: Mi5 (659.25 Hz)
          riproduciNota(659.25, adesso + 0.15, 0.22);
        } catch (err) {
          // Ignora silenziosamente se il dispositivo blocca l'AudioContext
        }
      }

      function riproduciNota(frequenza, inizio, durata) {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(frequenza, inizio);

        gain.gain.setValueAtTime(0.001, inizio);
        gain.gain.exponentialRampToValueAtTime(0.25, inizio + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, inizio + durata);

        osc.connect(gain);
        gain.connect(audioContext.destination);

        osc.start(inizio);
        osc.stop(inizio + durata + 0.02);
      }

      /**
       * Mostra un avviso chiaro con il nome del file mancante senza bloccare l'app.
       */
      function mostraErroreAudio(nomeFile) {
        errorMessage.textContent = 'Non trovo il file «' + nomeFile + '» nella cartella del gioco. Controlla che il file esista e abbia questo nome esatto.';
        errorBanner.classList.add('visible');
        listenButton.classList.remove('playing');
        listenLabel.textContent = 'Ascolta';
      }

      function nascondiErroreAudio() {
        errorBanner.classList.remove('visible');
      }

      /**
       * Ferma eventuali audio in corso.
       */
      function fermaAudio() {
        try {
          audioPlayer.pause();
          audioPlayer.currentTime = 0;
        } catch (e) {
          // Nessuna azione richiesta
        }
        listenButton.classList.remove('playing');
        listenLabel.textContent = 'Ascolta';
      }

      /**
       * Avvia la riproduzione del file MP3 del turno corrente.
       */
      function riproduciAudioCorrente() {
        const linguaAttuale = ordineDomande[indiceCorrente];
        if (!linguaAttuale) return;

        nascondiErroreAudio();
        fermaAudio();

        audioPlayer = new Audio(linguaAttuale.file);

        audioPlayer.addEventListener('playing', function () {
          listenButton.classList.add('playing');
          listenLabel.textContent = 'Sto suonando...';
        });

        audioPlayer.addEventListener('ended', function () {
          listenButton.classList.remove('playing');
          listenLabel.textContent = 'Ascolta di nuovo';
        });

        audioPlayer.addEventListener('error', function () {
          mostraErroreAudio(linguaAttuale.file);
        });

        const promessaPlay = audioPlayer.play();
        if (promessaPlay !== undefined) {
          promessaPlay.catch(function () {
            mostraErroreAudio(linguaAttuale.file);
          });
        }
      }

      /**
       * Prepara e mostra il turno corrente con 1 carta giusta e 2 scelte a caso.
       */
      function caricaTurno() {
        roundRisolto = false;
        nascondiErroreAudio();
        fermaAudio();

        const linguaCorretta = ordineDomande[indiceCorrente];

        // Aggiorna intestazione e istruzioni
        progressLabel.textContent = 'Domanda ' + (indiceCorrente + 1) + ' di ' + ordineDomande.length;
        instructionText.textContent = 'Premi «Ascolta» e poi tocca la bandiera giusta.';
        listenLabel.textContent = 'Ascolta';
        nextButton.classList.remove('visible');

        // Seleziona 2 carte sbagliate a caso tra le altre lingue
        const altreLingue = LINGUE.filter(function (item) {
          return item.id !== linguaCorretta.id;
        });
        const dueSbagliate = mescolaArray(altreLingue).slice(0, 2);

        // Unisce la corretta e le 2 sbagliate e le mescola
        const opzioniTurno = mescolaArray([linguaCorretta, dueSbagliate[0], dueSbagliate[1]]);

        // Crea le 3 grandi carte nel DOM
        cardsContainer.innerHTML = '';
        opzioniTurno.forEach(function (lingua) {
          const cardBtn = document.createElement('button');
          cardBtn.type = 'button';
          cardBtn.className = 'language-card';
          cardBtn.setAttribute('data-id', lingua.id);

          cardBtn.innerHTML =
            '<span class="flag-wrapper">' + lingua.bandieraSvg + '</span>' +
            '<span>' + lingua.nome + '</span>';

          cardBtn.addEventListener('click', function () {
            gestisciSceltaCarta(cardBtn, lingua.id === linguaCorretta.id);
          });

          cardsContainer.appendChild(cardBtn);
        });
      }

      /**
       * Gestisce il tocco su una delle 3 carte.
       */
      function gestisciSceltaCarta(cartaElement, isCorretta) {
        if (roundRisolto) return;

        if (isCorretta) {
          roundRisolto = true;
          fermaAudio();

          cartaElement.classList.remove('wrong');
          cartaElement.classList.add('correct');
          instructionText.textContent = 'Giusto! Premi «Avanti» per continuare.';

          // Disabilita tutte le carte
          const tutteLeCarte = cardsContainer.querySelectorAll('.language-card');
          tutteLeCarte.forEach(function (btn) {
            btn.disabled = true;
          });

          // Suona le due note brevi di festa e mostra il pulsante Avanti
          suonaNoteFesta();
          nextButton.classList.add('visible');
        } else {
          // Risposta sbagliata: fa tremare la carta e permette di riprovare senza penalità
          cartaElement.classList.remove('wrong');
          void cartaElement.offsetWidth; // Forza il riavvio dell'animazione CSS
          cartaElement.classList.add('wrong');
          instructionText.textContent = 'Riprova! Ascolta bene e tocca un’altra bandiera.';
        }
      }

      /**
       * Passa alla domanda successiva o alla schermata finale.
       */
      function vaiAvanti() {
        indiceCorrente += 1;

        if (indiceCorrente < ordineDomande.length) {
          caricaTurno();
        } else {
          mostraSchermataFinale();
        }
      }

      /**
       * Mostra la schermata finale «Bravi!» con il pulsante «Ricomincia».
       */
      function mostraSchermataFinale() {
        fermaAudio();
        nascondiErroreAudio();
        progressLabel.textContent = 'Gioco completato';
        gameScreen.classList.add('hidden');
        endScreen.classList.add('visible');
        suonaNoteFesta();
      }

      /**
       * Avvia una nuova partita mescolando tutti i suoni.
       */
      function avviaNuovaPartita() {
        ordineDomande = mescolaArray(LINGUE);
        indiceCorrente = 0;
        endScreen.classList.remove('visible');
        gameScreen.classList.remove('hidden');
        caricaTurno();
      }

      // Collegamento eventi ai pulsanti principali
      listenButton.addEventListener('click', riproduciAudioCorrente);
      nextButton.addEventListener('click', vaiAvanti);
      restartButton.addEventListener('click', avviaNuovaPartita);

      // Avvio iniziale al caricamento della pagina
      window.addEventListener('load', avviaNuovaPartita);
    })();
  </script>
</body>
</html>
